services:
  loklingo-metrics-proxy:
    image: nginx:1.27-alpine
    container_name: loklingo-metrics-proxy
    restart: unless-stopped
    ports:
      - "${METRICS_PROXY_HOST_PORT:-18081}:8081"
    environment:
      INTERNAL_TOKEN: "${INTERNAL_TOKEN:-}"
    command: >
      /bin/sh -c "envsubst '$$INTERNAL_TOKEN' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    volumes:
      - ./guide/governance/metrics-proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      loklingo-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - loklingo-net

  loklingo-prometheus:
    image: prom/prometheus:v2.54.1
    container_name: loklingo-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_HOST_PORT:-29090}:9090"
    volumes:
      - ./guide/governance/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./guide/governance/alerts/reliability-alerts.prometheus.yml:/etc/prometheus/rules/reliability-alerts.prometheus.yml:ro
      - loklingo-prometheus-data:/prometheus
    depends_on:
      loklingo-metrics-proxy:
        condition: service_healthy
    networks:
      - loklingo-net

  loklingo-grafana:
    image: grafana/grafana:11.1.0
    container_name: loklingo-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_HOST_PORT:-23000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/loklingo-reliability-dashboard.json
    volumes:
      - ./guide/governance/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./guide/governance/dashboards:/var/lib/grafana/dashboards:ro
      - loklingo-grafana-data:/var/lib/grafana
    depends_on:
      loklingo-prometheus:
        condition: service_started
    networks:
      - loklingo-net

volumes:
  loklingo-prometheus-data:
  loklingo-grafana-data:
