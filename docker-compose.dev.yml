# Development overlay — wires the backend to the Redis instance on the host (latitude).
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# SECURITY NOTE: as of 2026-07-19, the base compose no longer publishes the
# Ollama HTTP port to the host (it has no built-in auth and the host port
# is a documented security risk). To bring it up locally for development,
# use the separate opt-in overlay:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#     -f docker-compose.ollama-host.yml up
# See guide/security-hardening.md for context.

services:
  loklingo-backend:
    ports:
      - "${BACKEND_HOST_PORT:-28080}:8080"
    environment:
      OCR_SERVICE_URL: "http://loklingo-ocr:8000"
      REDIS_URL: "${REDIS_URL}"

  loklingo-ocr:
    ports:
      - "${OCR_HOST_PORT:-8000}:8000"

  loklingo-frontend:
    # Non-root nginx listens on 8080 in-container.
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:8080"
