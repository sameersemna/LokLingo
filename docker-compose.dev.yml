# Development overlay — wires the backend to the Redis instance on the host (latitude).
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  loklingo-backend:
    ports:
      - "${BACKEND_HOST_PORT:-28080}:8080"
    environment:
      OCR_SERVICE_URL: "http://loklingo-ocr:8000"
      REDIS_URL: "${REDIS_URL}"

  loklingo-ocr:
    ports:
      - "${OCR_HOST_PORT:-8000}:8000"

  loklingo-frontend:
    # Non-root nginx listens on 8080 in-container.
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:8080"
