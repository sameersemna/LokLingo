groups:
  - name: loklingo-reliability
    interval: 30s
    rules:
      - alert: LokLingoQueueDepthHigh
        expr: loklingo_queue_depth >= 500
        for: 10m
        labels:
          severity: warning
          service: loklingo
        annotations:
          summary: LokLingo queue depth is elevated
          description: Queue depth has stayed above 500 for 10 minutes.

      - alert: LokLingoQueueDepthCritical
        expr: loklingo_queue_depth >= 1000
        for: 5m
        labels:
          severity: critical
          service: loklingo
        annotations:
          summary: LokLingo queue depth is critical
          description: Queue depth has stayed above 1000 for 5 minutes.

      - alert: LokLingoStuckJobsDetected
        expr: loklingo_queue_stuck_jobs >= 1
        for: 10m
        labels:
          severity: warning
          service: loklingo
        annotations:
          summary: LokLingo has stuck inflight jobs
          description: At least one job has been stuck in inflight for 10 minutes.

      - alert: LokLingoDeadLetterGrowth
        expr: loklingo_queue_dead_letter_volume >= 10
        for: 5m
        labels:
          severity: critical
          service: loklingo
        annotations:
          summary: LokLingo dead-letter volume is growing
          description: Dead-letter queue exceeded 10 items for 5 minutes.

      - alert: LokLingoChunkSuccessDrop
        expr: loklingo_pipeline_chunk_success_ratio < 0.95
        for: 10m
        labels:
          severity: warning
          service: loklingo
        annotations:
          summary: LokLingo chunk success ratio dropped
          description: Chunk success ratio is below 95 percent for 10 minutes.

      - alert: LokLingoExportSuccessDrop
        expr: loklingo_pipeline_export_success_ratio < 0.98
        for: 10m
        labels:
          severity: warning
          service: loklingo
        annotations:
          summary: LokLingo export success ratio dropped
          description: Export success ratio is below 98 percent for 10 minutes.

      - alert: LokLingoProviderTimeoutSpike
        expr: sum(increase(loklingo_provider_timeout_total[5m])) by (provider) > 20
        for: 5m
        labels:
          severity: warning
          service: loklingo
        annotations:
          summary: Provider timeout spike detected
          description: Provider {{ $labels.provider }} exceeded 20 timeouts over 5 minutes.

      - alert: LokLingoRetryBacklogHigh
        expr: loklingo_queue_retry_backlog >= 50
        for: 10m
        labels:
          severity: warning
          service: loklingo
        annotations:
          summary: LokLingo retry backlog is elevated
          description: Retry backlog has stayed above 50 for 10 minutes.

      - alert: LokLingoRetryBacklogCritical
        expr: loklingo_queue_retry_backlog >= 200
        for: 5m
        labels:
          severity: critical
          service: loklingo
        annotations:
          summary: LokLingo retry backlog is critical
          description: Retry backlog has stayed above 200 for 5 minutes.

      - alert: LokLingoDegradedModeSpike
        expr: increase(loklingo_degraded_mode_total[10m]) > 20
        for: 5m
        labels:
          severity: warning
          service: loklingo
        annotations:
          summary: LokLingo degraded-mode events are spiking
          description: Degraded-mode events increased by more than 20 over 10 minutes.

      - alert: LokLingoRenderFallbackSpike
        expr: increase(loklingo_degraded_render_fallback_total[10m]) > 5
        for: 5m
        labels:
          severity: warning
          service: loklingo
        annotations:
          summary: LokLingo render fallbacks are rising
          description: Render fallback events increased by more than 5 over 10 minutes.

      - alert: LokLingoAdaptiveClampFrequent
        expr: increase(loklingo_adaptive_concurrency_clamp_total[10m]) > 10
        for: 5m
        labels:
          severity: warning
          service: loklingo
        annotations:
          summary: LokLingo is frequently clamping translation concurrency
          description: Adaptive clamp events exceeded 10 over 10 minutes, indicating sustained overload.

      - alert: LokLingoTimeoutStormDetected
        expr: increase(loklingo_pipeline_timeouts_total[10m]) > 8 and increase(loklingo_pipeline_retries_total[10m]) > 80
        for: 5m
        labels:
          severity: critical
          service: loklingo
        annotations:
          summary: LokLingo timeout storm detected
          description: Timeout and retry deltas breached storm thresholds over 10 minutes.

      - alert: LokLingoOCRFallbackBudgetExhausted
        expr: increase(loklingo_ocr_provider_fallback_budget_exhausted_total[10m]) > 0 and increase(loklingo_ocr_provider_fallback_budget_exhausted_total[10m]) < 3
        for: 5m
        labels:
          severity: warning
          service: loklingo
        annotations:
          summary: OCR provider fallback budget exhausted
          description: OCR fallback budget was exhausted at least once in the last 10 minutes.

      - alert: LokLingoOCRFallbackBudgetExhaustedCritical
        expr: increase(loklingo_ocr_provider_fallback_budget_exhausted_total[10m]) >= 3
        for: 5m
        labels:
          severity: critical
          service: loklingo
        annotations:
          summary: OCR provider fallback budget repeatedly exhausted
          description: OCR fallback budget exhaustion occurred three or more times in the last 10 minutes.

      - alert: LokLingoCircuitBreakerOpen
        expr: increase(loklingo_litellm_circuit_opened_total[10m]) > 0
        for: 2m
        labels:
          severity: warning
          service: loklingo
        annotations:
          summary: LiteLLM circuit breaker opened
          description: Translation circuit breaker opened at least once in the last 10 minutes — check LiteLLM/Ollama health.

      - alert: LokLingoCircuitRejectSpike
        expr: increase(loklingo_litellm_circuit_reject_total[5m]) > 30
        for: 5m
        labels:
          severity: critical
          service: loklingo
        annotations:
          summary: Translation requests rejected by open circuit breaker
          description: More than 30 circuit rejections in 5 minutes indicates sustained provider outage.

      - alert: LokLingoBackendDown
        expr: up{job="loklingo-metrics-proxy"} == 0
        for: 2m
        labels:
          severity: critical
          service: loklingo
        annotations:
          summary: LokLingo metrics endpoint is down
          description: Prometheus cannot scrape LokLingo metrics proxy — backend or proxy may be unavailable.
