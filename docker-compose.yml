services:
  loklingo-postgres:
    image: postgres:16-alpine
    container_name: loklingo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: loklingo
      POSTGRES_USER: "${POSTGRES_USER:-loklingo}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loklingo} -d loklingo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loklingo-net

  loklingo-backend:
    build:
      context: ./backend
    container_name: loklingo-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    environment:
      APP_ENV: "${APP_ENV:-development}"
      PORT: "8080"
      LITELLM_BASE_URL: "${LITELLM_BASE_URL}"
      LITELLM_API_KEY: "${LITELLM_API_KEY}"
      LITELLM_MODEL: "${LITELLM_MODEL:-gpt-4o-mini}"
      OCR_SERVICE_URL: "http://loklingo-ocr:8000"
      OCR_SHARED_STORAGE_DIR: "${OCR_SHARED_STORAGE_DIR:-/tmp/loklingo}"
      REDIS_URL: "${REDIS_URL:-}"
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-loklingo}:${POSTGRES_PASSWORD}@loklingo-postgres:5432/loklingo"
      INTERNAL_TOKEN: "${INTERNAL_TOKEN:-}"
    volumes:
      - pdf_uploads:${OCR_SHARED_STORAGE_DIR:-/tmp/loklingo}
    depends_on:
      loklingo-ocr:
        condition: service_healthy
      loklingo-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - loklingo-net

  loklingo-ocr:
    build:
      context: ./ocr-service
    container_name: loklingo-ocr
    restart: unless-stopped
    environment:
      OCR_SHARED_STORAGE_DIR: "${OCR_SHARED_STORAGE_DIR:-/tmp/loklingo}"
      MAX_PDF_UPLOAD_BYTES: "${MAX_PDF_UPLOAD_BYTES:-104857600}"
      MAX_PDF_PAGES: "${MAX_PDF_PAGES:-200}"
    volumes:
      - pdf_uploads:${OCR_SHARED_STORAGE_DIR:-/tmp/loklingo}:ro
    ports:
      - "${OCR_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - loklingo-net

  loklingo-frontend:
    build:
      context: ./frontend
    container_name: loklingo-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      loklingo-backend:
        condition: service_healthy
    networks:
      - loklingo-net

networks:
  loklingo-net:
    driver: bridge

volumes:
  postgres_data:
  pdf_uploads:
