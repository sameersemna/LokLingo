services:
  loklingo-backend:
    build:
      context: ./backend
    container_name: loklingo-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-28080}:8080"
    environment:
      APP_ENV: "${APP_ENV:-development}"
      PORT: "8080"
      LITELLM_BASE_URL: "${LITELLM_BASE_URL}"
      LITELLM_API_KEY: "${LITELLM_API_KEY}"
      LITELLM_MODEL: "${LITELLM_MODEL:-gpt-4o-mini}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-}"
      OPENAI_COMPAT_BASE_URL: "${OPENAI_COMPAT_BASE_URL:-}"
      OPENAI_COMPAT_API_KEY: "${OPENAI_COMPAT_API_KEY:-}"
      OPENAI_COMPAT_MODEL: "${OPENAI_COMPAT_MODEL:-}"
      OCR_SERVICE_URL: "${OCR_SERVICE_URL:-http://loklingo-ocr:8000}"
      OCR_PROVIDER: "${OCR_PROVIDER:-paddle}"
      OCR_PROVIDER_TIMEOUT_SECONDS: "${OCR_PROVIDER_TIMEOUT_SECONDS:-120}"
      OCR_UNLIMITED_PROVIDER_TIMEOUT_SECONDS: "${OCR_UNLIMITED_PROVIDER_TIMEOUT_SECONDS:-900}"
      OCR_MAX_FALLBACKS: "${OCR_MAX_FALLBACKS:-2}"
      OCR_SHARED_STORAGE_DIR: "${OCR_SHARED_STORAGE_DIR:-/tmp/loklingo}"
      REDIS_URL: "${REDIS_URL:-}"
      POSTGRES_DSN: "${POSTGRES_DSN}"
      INTERNAL_TOKEN: "${INTERNAL_TOKEN:-}"
      WRITE_API_TOKEN: "${WRITE_API_TOKEN:-}"
      GLOBAL_RATE_LIMIT_PER_MINUTE: "${GLOBAL_RATE_LIMIT_PER_MINUTE:-120}"
      WRITE_RATE_LIMIT_PER_MINUTE: "${WRITE_RATE_LIMIT_PER_MINUTE:-40}"
      UPLOAD_RATE_LIMIT_PER_MINUTE: "${UPLOAD_RATE_LIMIT_PER_MINUTE:-12}"
      SYNC_IMAGE_MAX_INFLIGHT: "${SYNC_IMAGE_MAX_INFLIGHT:-8}"
      MAX_PDF_UPLOAD_BYTES: "${MAX_PDF_UPLOAD_BYTES:-104857600}"
      MAX_PDF_PAGES: "${MAX_PDF_PAGES:-200}"
      TRANSLATE_CONCURRENCY: "${TRANSLATE_CONCURRENCY:-3}"
      MAX_LLM_CONCURRENCY: "${MAX_LLM_CONCURRENCY:-10}"
      TRANSLATE_CHUNK_MIN_WORDS: "${TRANSLATE_CHUNK_MIN_WORDS:-80}"
      TRANSLATE_CHUNK_MAX_WORDS: "${TRANSLATE_CHUNK_MAX_WORDS:-150}"
      LITELLM_REQUEST_TIMEOUT_SECONDS: "${LITELLM_REQUEST_TIMEOUT_SECONDS:-300}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pdf_uploads:${OCR_SHARED_STORAGE_DIR:-/tmp/loklingo}
    depends_on:
      loklingo-ocr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - loklingo-net

  loklingo-ocr:
    build:
      context: ./ocr-service
    container_name: loklingo-ocr
    restart: unless-stopped
    environment:
      OCR_SHARED_STORAGE_DIR: "${OCR_SHARED_STORAGE_DIR:-/tmp/loklingo}"
      MAX_PDF_UPLOAD_BYTES: "${MAX_PDF_UPLOAD_BYTES:-104857600}"
      MAX_PDF_PAGES: "${MAX_PDF_PAGES:-200}"
      OLLAMA_BASE_URL: "${OCR_OLLAMA_BASE_URL:-http://loklingo-ollama:11434}"
      OCR_DET_LIMIT_SIDE_LEN: "${OCR_DET_LIMIT_SIDE_LEN:-1280}"
      OCR_DOC_UNWARPING: "${OCR_DOC_UNWARPING:-false}"
      OCR_DOC_ORIENTATION_CLASSIFY: "${OCR_DOC_ORIENTATION_CLASSIFY:-false}"
      OCR_CORRECTION_ENABLED: "${OCR_CORRECTION_ENABLED:-false}"
      OCR_CORRECTION_MODEL: "${OCR_CORRECTION_MODEL:-Keyvan/german-ocr}"
      OCR_CORRECTION_TIMEOUT: "${OCR_CORRECTION_TIMEOUT:-8.0}"
      OCR_CORRECTION_RETRIES: "${OCR_CORRECTION_RETRIES:-1}"
      OCR_CORRECTION_LOW_CONFIDENCE_THRESHOLD: "${OCR_CORRECTION_LOW_CONFIDENCE_THRESHOLD:-0.78}"
      OCR_CORRECTION_MAX_CHUNK_BLOCKS: "${OCR_CORRECTION_MAX_CHUNK_BLOCKS:-24}"
      OCR_UNLIMITED_ENABLED: "${OCR_UNLIMITED_ENABLED:-false}"
      OCR_UNLIMITED_BASE_URL: "${OCR_UNLIMITED_BASE_URL:-http://loklingo-ocr-vlm:10000}"
      OCR_UNLIMITED_MODEL: "${OCR_UNLIMITED_MODEL:-baidu/Unlimited-OCR}"
      OCR_UNLIMITED_BACKEND: "${OCR_UNLIMITED_BACKEND:-transformers}"
      OCR_UNLIMITED_TIMEOUT: "${OCR_UNLIMITED_TIMEOUT:-600}"
      OCR_UNLIMITED_MAX_PAGES_PER_REQUEST: "${OCR_UNLIMITED_MAX_PAGES_PER_REQUEST:-5}"
      OCR_UNLIMITED_PAGE_OVERLAP: "${OCR_UNLIMITED_PAGE_OVERLAP:-1}"
      OCR_UNLIMITED_LANGS: "${OCR_UNLIMITED_LANGS:-}"
      OCR_UNLIMITED_FALLBACK_TO_PADDLE: "${OCR_UNLIMITED_FALLBACK_TO_PADDLE:-true}"
      OCR_UNLIMITED_DPI: "${OCR_UNLIMITED_DPI:-200}"
      OCR_UNLIMITED_MAX_OUTPUT_TOKENS_PER_PAGE: "${OCR_UNLIMITED_MAX_OUTPUT_TOKENS_PER_PAGE:-20000}"
    volumes:
      - pdf_uploads:${OCR_SHARED_STORAGE_DIR:-/tmp/loklingo}:ro
      - ocr_models:/home/ocr/.paddlex
    ports:
      - "${OCR_HOST_PORT:-8000}:8000"
    depends_on:
      loklingo-ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - loklingo-net

  loklingo-ollama:
    image: ollama/ollama:latest
    container_name: loklingo-ollama
    restart: unless-stopped
    # Ollama has no built-in authentication; its HTTP API is exposed on
    # the host by default. To avoid the unauthenticated host port, the
    # base compose does NOT publish any host port — the container is
    # reachable from the other LokLingo services over loklingo-net only.
    # For local development you can opt in to host exposure with:
    #   docker compose --profile ollama-host up ...
    # See guide/security-hardening.md ("Ollama port exposure") for
    # context, detection, and recovery.
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - loklingo-net

  loklingo-ocr-vlm:
    profiles:
      - ocr-vlm
    build:
      context: ./ocr-vlm
    container_name: loklingo-ocr-vlm
    restart: unless-stopped
    environment:
      MODEL_ID: "${OCR_UNLIMITED_MODEL:-baidu/Unlimited-OCR}"
      MODEL_REVISION: "${OCR_UNLIMITED_MODEL_REVISION:-8249d20b2822a7d8a4c22c8d8c9069b5ac36bda3}"
      HF_HOME: "/models/huggingface"
      HF_HUB_OFFLINE: "${OCR_UNLIMITED_OFFLINE:-1}"
      TRANSFORMERS_OFFLINE: "${OCR_UNLIMITED_OFFLINE:-1}"
      LOAD_MODEL_ON_STARTUP: "${OCR_UNLIMITED_LOAD_MODEL_ON_STARTUP:-true}"
      MAX_PAGES: "${OCR_UNLIMITED_MAX_PAGES_PER_REQUEST:-5}"
    volumes:
      - uocr_models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    networks:
      - loklingo-net

  loklingo-frontend:
    build:
      context: ./frontend
    container_name: loklingo-frontend
    restart: unless-stopped
    # Non-root nginx listens on 8080 inside the container (see frontend/Dockerfile).
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:8080"
    depends_on:
      loklingo-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - loklingo-net

networks:
  loklingo-net:
    driver: bridge

volumes:
  pdf_uploads:
  ollama_data:
  ocr_models:
  uocr_models:
