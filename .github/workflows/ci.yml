name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 7 * * 1'

jobs:
  governance-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate governance metadata
        run: bash guide/governance/check-governance-metadata.sh | tee governance-metadata-report.txt
      - name: Upload governance metadata report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-metadata-report
          path: governance-metadata-report.txt

  governance-freshness-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate governance review freshness
        run: bash guide/governance/check-governance-freshness.sh | tee governance-freshness-report.txt
      - name: Upload governance freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-freshness-report
          path: governance-freshness-report.txt

  governance-changelog-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate governance changelog discipline
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
          HEAD_REF: HEAD
        run: bash guide/governance/check-governance-changelog-discipline.sh | tee governance-changelog-report.txt
      - name: Upload governance changelog report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-changelog-report
          path: governance-changelog-report.txt

  backend-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - run: go test ./...

  frontend-build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  dev-smoke:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: [governance-check, governance-freshness-check, governance-changelog-check, backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Start compose stack
        run: |
          cp .env.development .env
          docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.ci.yml up -d --build
      - name: Run smoke test
        run: sh guide/smoke-dev.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.ci.yml logs --no-color
      - name: Stop compose stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.ci.yml down -v

  observability-artifacts-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate observability compose overlay
        run: |
          cp .env.development .env
          docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.observability.yml config
      - name: Validate observability smoke script syntax
        run: sh -n guide/smoke-observability.sh
      - name: Validate dashboard JSON
        run: |
          python3 -m json.tool guide/governance/dashboards/loklingo-reliability-dashboard.json >/dev/null
          python3 -m json.tool guide/governance/dashboards/loklingo-incident-timeline-dashboard.json >/dev/null
          python3 -m json.tool guide/governance/dashboards/loklingo-degraded-operations-dashboard.json >/dev/null
      - name: Validate provisioning YAML
        run: |
          python3 - <<'PYEOF'
          import yaml

          for path in [
            "guide/governance/prometheus/prometheus.yml",
            "guide/governance/grafana/provisioning/datasources/prometheus.yml",
            "guide/governance/grafana/provisioning/dashboards/dashboards.yml",
            "guide/governance/alerts/reliability-alerts.prometheus.yml",
          ]:
            with open(path, "r", encoding="utf-8") as handle:
              yaml.safe_load(handle)
          PYEOF
      - name: Validate Prometheus alert rules with promtool
        run: |
          docker run --rm --entrypoint promtool -v "$PWD:/workspace" -w /workspace prom/prometheus:v2.55.0 \
            check rules guide/governance/alerts/reliability-alerts.prometheus.yml

  security-gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block committed private keys
        run: |
          set -euo pipefail
          if git grep -nE 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' -- . ':!.git'; then
            echo "Private key material found in repository"
            exit 1
          fi
          echo "No private key material detected"
      - name: Shell syntax for critical ops scripts
        run: |
          bash -n scripts/self-heal.sh
          bash -n scripts/backup-restore.sh
          bash -n scripts/check-health.sh
          bash -n guide/ops/reliability-recovery.sh
      - name: Validate hardened prod compose config
        run: |
          cp .env.example .env
          {
            echo 'APP_ENV=production'
            echo 'WRITE_API_TOKEN=ci-test-write-token-not-for-prod-use-32'
            echo 'INTERNAL_TOKEN=ci-test-internal-token-not-for-prod-32'
            echo 'LITELLM_BASE_URL=http://litellm:4000'
            echo 'LITELLM_API_KEY=ci-litellm-key'
            echo 'REDIS_URL=redis://redis:6379'
          } >> .env
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile production config >/dev/null
      - name: Validate nginx hardening config is present
        run: |
          grep -q "Content-Security-Policy" frontend/nginx.conf
          grep -q "resolver 127.0.0.11" frontend/nginx.conf
          grep -q "client_max_body_size" frontend/nginx.conf

  e2e-playwright:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build, security-gates]
    steps:
      - uses: actions/checkout@v4
      - name: Start compose stack
        run: |
          if [ -f .env.development ]; then cp .env.development .env; else cp .env.example .env; fi
          docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.ci.yml up -d --build
      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:28080/health >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "backend never became healthy"
          docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.ci.yml logs --no-color
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        working-directory: e2e
        env:
          LOKLINGO_E2E_BASE_URL: http://localhost:3000
          LOKLINGO_BASE_URL: http://localhost:28080
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.ci.yml logs --no-color
      - name: Stop compose stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.ci.yml down -v

  governance-maintenance-scheduled:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run governance maintenance routine
        run: bash guide/governance/run-governance-maintenance.sh | tee governance-maintenance-report.txt
      - name: Upload governance maintenance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-maintenance-artifacts
          path: |
            governance-maintenance-report.txt
            guide/governance/archive/index.md
            guide/governance/current-pointers.md
            guide/governance/archive/drift/
            guide/governance/archive/drift/trend.csv